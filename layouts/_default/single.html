{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    
    <div style="margin: 10px 0; font-size: 0.9em; color: gray;">
        👁️ <span id="view-count">...</span> kez okundu
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  <script src="/js/supabase.js"></script>
  <script>
    window.onload = function() {
        const path = window.location.pathname.replace(/^\/|\/$/g, '') || 'home';
        // Hata payını azaltmak için fonksiyonları burada doğrudan çağırıyoruz
        updateViews(path);
        getViews(path).then(function(c) {
            document.getElementById('view-count').innerText = c || 0;
        });
    };
  </script>
</article>
{{ end }}
